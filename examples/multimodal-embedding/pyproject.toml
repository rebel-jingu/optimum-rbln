[project]
name = "embeddinggemma2-rbln-example"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1+cpu", "torchvision==0.29.1+cpu", "transformers==5.20.1",
  "diffusers==0.41.0", "accelerate>=1.0.1", "numpy>=2,<3", "pillow>=11",
  "soundfile>=0.13", "scipy>=1.14", "librosa>=0.11", "pytest>=8", "ruff>=0.3.3",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
